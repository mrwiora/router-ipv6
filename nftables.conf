#!/usr/bin/nft -f
# nftables configuration for IPv6 router
# Primary: NAT66 via WAN2 (enp8s0) using delegated prefix
# Failover: Native routing via WAN1 (enp7s0) using delegated prefix when WAN2 is down

flush ruleset

define LAN_IF = enp1s0
define WAN1_IF = enp7s0
define WAN2_IF = enp8s0
define DELEGATED_PREFIX = 2a00:1f:c0:9bfa::/64

table ip6 nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # NAT66: Masquerade delegated prefix traffic going out WAN2
        # This is the primary path - router rewrites source to WAN2's address
        oifname $WAN2_IF ip6 saddr $DELEGATED_PREFIX masquerade

        # No NAT for WAN1 - uses native delegated prefix routing (failover)
    }
}

table ip6 filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept loopback
        iif lo accept

        # Accept all ICMPv6 (essential for IPv6)
        ip6 nexthdr ipv6-icmp accept

        # Accept DHCPv6 client on WAN interfaces
        iifname { $WAN1_IF, $WAN2_IF } udp sport 547 udp dport 546 accept

        # Accept router advertisements and neighbor discovery on WAN
        iifname { $WAN1_IF, $WAN2_IF } icmpv6 type {
            nd-router-advert,
            nd-router-solicit,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            nd-redirect
        } accept

        # Accept neighbor discovery from LAN
        iifname $LAN_IF icmpv6 type {
            nd-router-solicit,
            nd-neighbor-solicit,
            nd-neighbor-advert
        } accept

        # Accept SSH from LAN
        iifname $LAN_IF tcp dport 22 accept

        # Accept DNS from LAN (optional)
        iifname $LAN_IF udp dport 53 accept
        iifname $LAN_IF tcp dport 53 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept all ICMPv6 forwarding (essential)
        ip6 nexthdr ipv6-icmp accept

        # Forward delegated prefix traffic from LAN to WAN interfaces
        # Will be routed to WAN2 (NAT66) or WAN1 (native) based on policy
        iifname $LAN_IF oifname { $WAN1_IF, $WAN2_IF } ip6 saddr $DELEGATED_PREFIX accept

        # Forward return traffic from WAN to LAN
        iifname { $WAN1_IF, $WAN2_IF } oifname $LAN_IF accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

