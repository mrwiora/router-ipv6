#!/usr/bin/nft -f
# nftables configuration for IPv4 router
# LAN: enp1s0 (10.1.1.0/24)
# WAN: enp7s0 (10.89.223.12/29)

flush ruleset

define LAN_IF = enp1s0
define WAN_IF = enp7s0
define LAN_IPV4 = 10.1.1.0/24

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Masquerade LAN traffic going out WAN
        oifname $WAN_IF ip saddr $LAN_IPV4 masquerade
    }
}

table ip filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept loopback
        iif lo accept

        # Accept ICMP (ping, etc.)
        ip protocol icmp accept

        # Accept SSH from LAN
        iifname $LAN_IF tcp dport 22 accept

        # Accept DNS from LAN
        iifname $LAN_IF udp dport 53 accept
        iifname $LAN_IF tcp dport 53 accept

        # Accept DHCP from LAN
        iifname $LAN_IF udp sport 68 udp dport 67 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept ICMP forwarding
        ip protocol icmp accept

        # Forward LAN traffic to WAN
        iifname $LAN_IF oifname $WAN_IF ip saddr $LAN_IPV4 accept

        # Forward return traffic from WAN to LAN
        iifname $WAN_IF oifname $LAN_IF accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
