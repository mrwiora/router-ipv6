#!/usr/bin/nft -f
# nftables configuration for IPv4/IPv6 router
# IPv6 - Primary: NAT66 via WAN2 (enp8s0) using delegated prefix
# IPv6 - Failover: Native routing via WAN1 (enp7s0) using delegated prefix when WAN2 is down
# IPv4 - Primary: NAT44 via WAN2 (enp8s0)
# IPv4 - Failover: NAT44 via WAN1 (enp7s0) when WAN2 is down

flush ruleset

define LAN_IF = { enp1s0, enp9s0, enp10s0, enp11s0 }
define WAN1_IF = enp2s0
define WAN2_IF = enp3s0
define LAN1_IPV4 = 172.17.0.0/24
define LAN2_IPV4 = 172.17.1.0/24
define LAN3_IPV4 = 172.17.2.0/24
define LAN4_IPV4 = 172.17.3.0/24

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Primary: Masquerade LAN traffic going out WAN2 (enp3s0)
        oifname $WAN2_IF ip saddr { $LAN1_IPV4, $LAN2_IPV4, $LAN3_IPV4, $LAN4_IPV4 } masquerade

        # Failover: Masquerade LAN traffic going out WAN1 (enp2s0)
        oifname $WAN1_IF ip saddr { $LAN1_IPV4, $LAN2_IPV4, $LAN3_IPV4, $LAN4_IPV4 } masquerade
    }
}

table ip6 nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # NAT66: Masquerade LAN IPv6 traffic going out WAN2
        # This is the primary path - router rewrites source to WAN2's address
        iifname $LAN_IF oifname $WAN2_IF masquerade

        # No NAT for WAN1 - uses native delegated prefix routing (failover)
    }
}

table ip filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept loopback
        iif lo accept

        # Accept ICMP (ping, etc.)
        ip protocol icmp accept

        # Accept SSH from LAN
        iifname $LAN_IF tcp dport 22 accept

        # Accept DNS from LAN (optional)
        iifname $LAN_IF udp dport 53 accept
        iifname $LAN_IF tcp dport 53 accept

        # Accept DHCP from LAN
        iifname $LAN_IF udp sport 68 udp dport 67 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept ICMP forwarding
        ip protocol icmp accept

        # Forward LAN traffic to WAN interfaces (routing/NAT will handle the rest)
        iifname $LAN_IF oifname { $WAN1_IF, $WAN2_IF } ip saddr { $LAN1_IPV4, $LAN2_IPV4, $LAN3_IPV4, $LAN4_IPV4 } accept

        # Forward return traffic from WAN to LAN
        iifname { $WAN1_IF, $WAN2_IF } oifname $LAN_IF accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip6 filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept loopback
        iif lo accept

        # Accept all ICMPv6 (essential for IPv6)
        ip6 nexthdr ipv6-icmp accept

        # Accept DHCPv6 client on WAN interfaces
        iifname { $WAN1_IF, $WAN2_IF } udp sport 547 udp dport 546 accept

        # Accept router advertisements and neighbor discovery on WAN
        iifname { $WAN1_IF, $WAN2_IF } icmpv6 type {
            nd-router-advert,
            nd-router-solicit,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            nd-redirect
        } accept

        # Accept neighbor discovery from LAN
        iifname $LAN_IF icmpv6 type {
            nd-router-solicit,
            nd-neighbor-solicit,
            nd-neighbor-advert
        } accept

        # Accept SSH from LAN
        iifname $LAN_IF tcp dport 22 accept

        # Accept DNS from LAN (optional)
        iifname $LAN_IF udp dport 53 accept
        iifname $LAN_IF tcp dport 53 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Accept established/related connections
        ct state established,related accept
        ct state invalid drop

        # Accept all ICMPv6 forwarding (essential)
        ip6 nexthdr ipv6-icmp accept

        # Forward IPv6 traffic from LAN to WAN interfaces
        # Will be routed to WAN2 (NAT66) or WAN1 (native) based on policy
        iifname $LAN_IF oifname { $WAN1_IF, $WAN2_IF } accept

        # Forward return traffic from WAN to LAN
        iifname { $WAN1_IF, $WAN2_IF } oifname $LAN_IF accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
